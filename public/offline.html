<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Ravana - Offline Mode</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 420px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 34px;
      padding: 32px;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 80px rgba(220, 38, 38, 0.22);
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 0 45px rgba(234, 179, 8, 0.22);
    }
    h1 {
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }
    p {
      font-size: 16px;
      line-height: 1.75;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      background: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.3);
      border-radius: 9999px;
      padding: 12px 20px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #facc15;
      margin-bottom: 24px;
    }
    .info-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
    }
    .info-box p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.65);
      margin: 0;
    }
    .info-box .label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #facc15;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <div class="badge">Offline Mode</div>
    <h1>You're Offline</h1>
    <p>No internet connection detected. Your scans will be saved and synced automatically when you're back online.</p>
    <div class="info-box">
      <div class="label">Offline Mode Active</div>
      <p>The app will continue to work. Scans are queued locally.</p>
    </div>
  </div>
</body>
</html>
